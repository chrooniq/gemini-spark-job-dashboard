name: 3-Hour Autonomous Job Intelligence Refresh

on:
  schedule:
    # Runs every 3 hours at 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 PKT (UTC+5)
    # Corresponding UTC: 19:00, 22:00, 01:00, 04:00, 07:00, 10:00, 13:00, 16:00 UTC
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch: # Allows instant manual refresh anytime from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "job-refresh"
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install openpyxl

      - name: Execute 3-Hour Job Refresh & Application Tracking Engine
        run: |
          python scripts/generate_job_refresh.py

      - name: Commit and Push Updated Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html email_template.html
          if git diff --staged --quiet; then
            echo "No new job or status changes detected in this cycle."
          else
            git commit -m "chore: refresh job dataset $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
